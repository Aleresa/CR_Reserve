<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b25">
  <meta name="description" content="Поставки Цифрового Рая. Выбирайте товары в пути и оформляйте резерв.">
  <title>CR Reserve — Поставки</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="./jszip.min.js"></script>
  <script type="module" src="./app.js"></script>

<body>
  <header class="topbar"><a class="brand" href="#"><span class="brand-mark">CR</span><span>ЦИФРОВОЙ РАЙ<small>Резерв поставок</small></span></a><button id="refresh" class="icon-button" aria-label="Обновить">↻</button></header>
