name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check public/app.js && node --check public/xlsx.js && node --check server/worker.mjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2 jszip@3.10.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
